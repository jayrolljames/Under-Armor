<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #1e3a8a, #9333ea);
    }
    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -1;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center text-white min-h-screen">
  <!-- Particle Background -->
  <div id="particles-js"></div>

  <header class="text-center mb-6 animate-fadeIn">
    <h1 class="text-4xl font-extrabold mb-2">Command Center</h1>
    <p class="text-lg opacity-90">Your centralized control dashboard</p>
  </header>

  <section class="w-full max-w-4xl p-6 bg-white bg-opacity-10 rounded-xl shadow-lg backdrop-blur-md animate-fadeIn">
    <h2 class="text-2xl font-bold mb-4">System Status</h2>
    <canvas id="statusChart" height="120"></canvas>
  </section>

  <script>
    const ctx = document.getElementById('statusChart');
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Active', 'Idle', 'Offline'],
        datasets: [{
          data: [60, 25, 15],
          backgroundColor: ['#34d399', '#fbbf24', '#ef4444'],
        }]
      }
    });
  </script>

  <!-- Particles.js -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <script>
    particlesJS('particles-js', {
      particles: {
        number: { value: 80 },
        size: { value: 3 },
        move: { speed: 2 },
        line_linked: { enable: true, color: '#ffffff' },
        color: { value: '#ffffff' }
      },
      interactivity: {
        events: { onhover: { enable: true, mode: 'repulse' } }
      }
    });
  </script>

  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fadeIn { animation: fadeIn 1.5s ease-in-out; }
  </style>
</body>
</html>
